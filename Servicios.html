<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema en Creación</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    padding:20px;
}

.logo{
    font-size:40px;
    margin-bottom:20px;
}

h1{
    font-size:clamp(28px,5vw,50px);
    margin-bottom:20px;
}

p{
    font-size:clamp(16px,2vw,22px);
    max-width:800px;
    line-height:1.6;
}

.fecha{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
    color:#38bdf8;
}

.footer{
    position:fixed;
    bottom:15px;
    width:100%;
    text-align:center;
    font-size:14px;
    color:#cbd5e1;
}
</style>

</head>
<body>

<div class="logo">🏗️</div>

<h1>Sistema en Creación</h1>

<p>
Estamos trabajando para ofrecerte una mejor experiencia.
</p>

<p class="fecha">
Estará disponible a más tardar el día 25 de julio de 2026.
</p>

<p style="margin-top:20px;">
Gracias por tu paciencia. Estamos a tus órdenes.
</p>

<p style="margin-top:10px;font-size:22px;font-weight:bold;">
Company García Corona
</p>

<div class="footer">
© 2026 Company García Corona | Todos los derechos reservados
</div>

</body>
</html>
