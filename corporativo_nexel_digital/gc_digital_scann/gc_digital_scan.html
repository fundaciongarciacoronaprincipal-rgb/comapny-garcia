<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>gc digital scann</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

body{margin:0;font-family:Arial;background:white;text-align:center;}

.menu{
position:fixed;
left:-260px;
width:260px;height:100%;
background:#0047AB;
transition:.3s;padding-top:60px;
}
.menu a{display:block;padding:15px;color:white;text-decoration:none;}
.menu.active{left:0;}

.topbar{
height:60px;background:#0047AB;color:white;
display:flex;align-items:center;padding-left:15px;font-size:24px;
}

.content{padding:20px;}

.scanner-box{
margin:auto;width:260px;height:260px;
border:4px solid #0047AB;border-radius:15px;
overflow:hidden;position:relative;background:white;
}

video{width:100%;height:100%;object-fit:cover;}

.scan-line{
position:absolute;width:100%;height:3px;background:red;
animation:scan 1.5s linear infinite;
}

@keyframes scan{
0%{top:0;}
50%{top:50%;}
100%{top:100%;}
}

.result-box{
margin-top:15px;
background:rgba(0,0,0,.05);
padding:12px;border-radius:12px;
}

button{
background:#0047AB;color:white;border:none;
padding:10px 15px;border-radius:20px;margin:4px;
}

input,textarea{
width:90%;max-width:300px;
padding:10px;margin:8px;border-radius:8px;border:1px solid #ccc;
}

.switch{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin:10px;
}

</style>
</head>

<body>

<div class="menu" id="menu">
<a onclick="mostrar('scan')">📷 Escanear</a>
<a onclick="mostrar('crear')">➕ Crear QR</a>
<a onclick="mostrar('miqr')">👤 Mi Código</a>
<a onclick="mostrar('historial')">🕘 Historial</a>
<a onclick="mostrar('config')">⚙️ Configuración</a>
</div>

<div class="topbar">
<span onclick="menu.classList.toggle('active')">☰</span>
</div>

<div class="content">

<!-- SCAN -->
<div id="scan">
<h2>Escáner</h2>

<div class="scanner-box">
<video id="video"></video>
<div class="scan-line"></div>
</div>

<div class="result-box" id="resultBox">Escanea un código...</div>
</div>

<!-- CREAR -->
<div id="crear" style="display:none;">
<h2>Crear QR</h2>
<input id="qrtext" placeholder="Texto o link">
<button onclick="crearQR()">Generar</button>
<div id="qrcode"></div>
</div>

<!-- MI QR -->
<div id="miqr" style="display:none;">
<h2>Mi Código QR</h2>

<input id="nombre" placeholder="Nombre">
<input id="telefono" placeholder="Teléfono">
<input id="correo" placeholder="Correo">
<textarea id="direccion" placeholder="Dirección"></textarea>

<button onclick="crearMiQR()">Crear</button>
<div id="miqrcode"></div>
</div>

<!-- HISTORIAL -->
<div id="historial" style="display:none;">
<h2>Historial</h2>
<div id="listaHistorial"></div>
<button onclick="borrarHistorial()">Borrar Historial</button>
</div>

<!-- CONFIG -->
<div id="config" style="display:none;">
<h2>Configuración</h2>

<div class="switch">
<label>Vibración</label>
<input type="checkbox" id="vibracion">
</div>

<div class="switch">
<label>Sonido</label>
<input type="checkbox" id="sonido">
</div>

</div>

</div>

<script>

/* CONFIGURACION */
let config=JSON.parse(localStorage.getItem("config"))||
{vibracion:true,sonido:true};

vibracion.checked=config.vibracion;
sonido.checked=config.sonido;

vibracion.onchange=()=>guardarConfig();
sonido.onchange=()=>guardarConfig();

function guardarConfig(){
config={
vibracion:vibracion.checked,
sonido:sonido.checked
};
localStorage.setItem("config",JSON.stringify(config));
}

/* MENU */
function mostrar(id){
document.querySelectorAll(".content>div")
.forEach(d=>d.style.display="none");
document.getElementById(id).style.display="block";
menu.classList.remove("active");

if(id==="historial") cargarHistorial();
}

/* HISTORIAL */
function guardarHistorial(texto){
let hist=JSON.parse(localStorage.getItem("historial"))||[];
hist.unshift(texto);
localStorage.setItem("historial",JSON.stringify(hist.slice(0,50)));
}

function cargarHistorial(){
let hist=JSON.parse(localStorage.getItem("historial"))||[];
listaHistorial.innerHTML=hist.map(h=>`<p>${h}</p>`).join("");
}

function borrarHistorial(){
localStorage.removeItem("historial");
cargarHistorial();
}

/* SONIDO */
const beep=new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");

/* ESCANER */
const reader=new ZXing.BrowserMultiFormatReader();

reader.decodeFromVideoDevice(null,'video',(result)=>{

if(result){

let texto=result.text;

guardarHistorial(texto);

/* vibracion */
if(config.vibracion) navigator.vibrate(120);

/* sonido */
if(config.sonido) beep.play();

detectarTipo(texto);

}

},{fps:30,delayBetweenScanAttempts:40});

/* DETECTAR TIPO */
function detectarTipo(texto){

let html=`<b>${texto}</b><br>
<button onclick="copiar('${texto}')">Copiar</button>`;

/* WIFI */
if(texto.startsWith("WIFI:")){

let datos=texto
.replace("WIFI:","")
.split(";");

let ssid=datos[0].split(":")[1];
let pass=datos[2]?.split(":")[1];

html+=`<button onclick="alert('Conéctate manualmente a: ${ssid}')">📶 Conectar WiFi</button>`;
}

/* LINK */
if(texto.startsWith("http"))
html+=`<button onclick="window.open('${texto}')">Abrir Link</button>`;

/* TEL */
if(/^[0-9+]+$/.test(texto))
html+=`<button onclick="location='tel:${texto}'">Llamar</button>`;

/* MAIL */
if(texto.includes("@"))
html+=`<button onclick="location='mailto:${texto}'">Correo</button>`;

resultBox.innerHTML=html;
}

function copiar(t){
navigator.clipboard.writeText(t);
}

/* QR */
function crearQR(){
qrcode.innerHTML="";
new QRCode("qrcode",{text:qrtext.value,width:220,height:220});
}

/* MI QR */
function crearMiQR(){

let vcard=`BEGIN:VCARD
FN:${nombre.value}
TEL:${telefono.value}
EMAIL:${correo.value}
ADR:${direccion.value}
END:VCARD`;

miqrcode.innerHTML="";
new QRCode("miqrcode",{text:vcard,width:220,height:220});
}

</script>

</body>
</html>
