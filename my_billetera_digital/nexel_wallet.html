<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexPay Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#87CEEB;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.container{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.seccion{
    display:none;
}

.active{
    display:block;
}

h1,h2,h3{
    text-align:center;
    color:#203a43;
}

input{
    width:100%;
    padding:14px;
    margin-top:12px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#1d4ed8;
}

#saludoUsuario{
    color:black;
    text-align:center;
    margin-bottom:20px;
}

/* TARJETA */

.saldoCard{
    position:relative;
    width:100%;
    height:235px;
    background:
    linear-gradient(
        135deg,
        #1e3a8a,
        #2563eb,
        #60a5fa
    );
    border-radius:22px;
    padding:20px;
    color:white;
    margin-bottom:20px;
    overflow:hidden;
}

.walletTitle{
    position:absolute;
    top:18px;
    right:20px;
    font-size:15px;
    font-weight:bold;
}

.chip{
    width:60px;
    height:40px;
    background:
    linear-gradient(
        135deg,
        #fcd34d,
        #f59e0b
    );
    border-radius:10px;
    position:absolute;
    top:38px;
    left:20px;
}

.saldoNumero{
    position:absolute;
    top:92px;
    left:20px;
    font-size:33px;
    font-weight:bold;
}

.saldoLabel{
    position:absolute;
    top:138px;
    left:22px;
    font-size:13px;
    opacity:0.8;
}

.usuarioCardNombre{
    position:absolute;
    top:155px;
    left:22px;
    font-size:14px;
    font-weight:bold;
}

.datosInferiores{
    position:absolute;
    left:22px;
    top:185px;
    display:flex;
    gap:35px;
}

.datoBox{
    display:flex;
    flex-direction:column;
}

.small{
    font-size:11px;
    opacity:0.7;
    margin:0;
}

.infoValor{
    font-size:13px;
    font-weight:bold;
    margin-top:4px;
}

.card{
    background:#f5f5f5;
    padding:15px;
    border-radius:12px;
    margin-top:20px;
}

@media (max-width:700px){

    .container{
        max-width:100%;
    }

    .saldoNumero{
        font-size:28px;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- INICIO -->

<div id="inicio" class="seccion active">

<h1>NexPay Wallet</h1>

<button onclick="mostrar('login')">
Iniciar sesión
</button>

<button onclick="mostrar('registro')">
Crear cuenta
</button>

</div>

<!-- LOGIN -->

<div id="login" class="seccion">

<h2>Iniciar sesión</h2>

<input
type="text"
id="loginUsuario"
placeholder="Usuario"
>

<input
type="password"
id="loginPassword"
placeholder="Contraseña"
>

<button onclick="iniciarSesion()">
Entrar
</button>

<button onclick="mostrar('inicio')">
Volver
</button>

</div>

<!-- REGISTRO -->

<div id="registro" class="seccion">

<h2>Crear cuenta</h2>

<input
type="text"
id="nuevoUsuario"
placeholder="Usuario"
>

<input
type="password"
id="nuevoPassword"
placeholder="Contraseña"
>

<button onclick="crearCuenta()">
Crear cuenta
</button>

<button onclick="mostrar('inicio')">
Volver
</button>

</div>

<!-- WALLET -->

<div id="wallet" class="seccion">

<h2 id="saludoUsuario">
¡HOLA! BIENVENID@
</h2>

<div class="saldoCard">

<div class="walletTitle">
NEXPAY WALLET
</div>

<div class="chip"></div>

<div
class="saldoNumero"
id="saldoTexto"
>
$0
</div>

<div class="saldoLabel">
Saldo disponible
</div>

<div
class="usuarioCardNombre"
id="usuarioCardNombre"
>
usuario
</div>

<div class="datosInferiores">

<div class="datoBox">

<p class="small">
CLABE
</p>

<p
class="infoValor"
id="clabeInfoCard"
>
0000000000
</p>

</div>

<div class="datoBox">

<p class="small">
Referencia
</p>

<p
class="infoValor"
id="referenciaInfoCard"
>
0000000
</p>

</div>

</div>

</div>

<button onclick="mostrarPagoServicio()">
Pagar servicio Company García Corona
</button>

<button onclick="mostrarTransferencia()">
Transferencia interna
</button>

<button onclick="mostrarCanje()">
Canjear código
</button>

<button onclick="cerrarSesion()">
Cerrar sesión
</button>

</div>

<!-- PAGAR SERVICIO -->

<div id="pagoServicio" class="seccion">

<h2>Pagar servicio</h2>

<input
type="text"
id="numeroServicioPago"
placeholder="Número de servicio o referencia"
>

<button onclick="consultarServicio()">
Consultar saldo
</button>

<div
id="infoServicio"
class="card"
style="display:none;"
>

<h3 id="saldoServicioTexto">
Saldo pendiente: $0
</h3>

<input
type="number"
id="montoPago"
placeholder="Monto a pagar"
>

<button onclick="pagarServicio()">
Realizar pago
</button>

</div>

<button onclick="volverWallet()">
Volver
</button>

</div>

<!-- TRANSFERENCIA -->

<div id="transferencia" class="seccion">

<h2>Transferencia interna</h2>

<input
type="text"
id="destinoTransferencia"
placeholder="Usuario, CLABE o referencia"
>

<input
type="number"
id="montoTransferencia"
placeholder="Monto"
>

<button onclick="hacerTransferencia()">
Transferir
</button>

<button onclick="volverWallet()">
Volver
</button>

</div>

<!-- CANJEAR -->

<div id="canje" class="seccion">

<h2>Canjear código</h2>

<input
type="text"
id="codigoCanje"
placeholder="Ingresa tu código"
>

<button onclick="canjearCodigo()">
Canjear
</button>

<button onclick="volverWallet()">
Volver
</button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://ieaielptonscbsimbtyx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pmJ3fN_2FUKM1AskoReusA_0vaZz7f_";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let usuarioActual = null;
let servicioActual = null;

/* MOSTRAR */

function mostrar(id){

    document
    .querySelectorAll(".seccion")
    .forEach(sec=>{

        sec.classList.remove("active");

    });

    document
    .getElementById(id)
    .classList.add("active");

}

/* GENERAR NUMEROS */

function generarNumeros(longitud){

    let resultado = "";

    for(let i=0;i<longitud;i++){

        resultado +=
        Math.floor(Math.random()*10);

    }

    return resultado;

}

/* PDF */

function generarPDF(
    tipo,
    datos
){

    const { jsPDF } =
    window.jspdf;

    const doc =
    new jsPDF();

    const fecha =
    new Date().toLocaleString();

    const folio =
    "NX-" +
    Math.floor(
        Math.random() * 999999999
    );

    doc.setFontSize(24);

    doc.text(
        "NEXUS WALLET",
        20,
        25
    );

    doc.setFontSize(16);

    doc.text(
        tipo,
        20,
        45
    );

    doc.setFontSize(12);

    doc.text(
        "Folio: " + folio,
        20,
        60
    );

    doc.text(
        "Fecha: " + fecha,
        20,
        70
    );

    let y = 90;

    datos.forEach(item=>{

        doc.text(
            item,
            20,
            y
        );

        y += 12;

    });

    doc.save(
        folio + ".pdf"
    );

}

/* CREAR CUENTA */

async function crearCuenta(){

    const usuario =
    document.getElementById(
        "nuevoUsuario"
    ).value;

    const password =
    document.getElementById(
        "nuevoPassword"
    ).value;

    const identificador =
    generarNumeros(10);

    const referencia =
    generarNumeros(7);

    const { error } =
    await supabaseClient
    .from("nexus_wallet_users")
    .insert([
        {
            usuario,
            password,
            identificador,
            referencia,
            saldo:0
        }
    ]);

    if(error){

        alert(error.message);
        return;

    }

    alert("Cuenta creada");

    mostrar("login");

}

/* LOGIN */

async function iniciarSesion(){

    const usuario =
    document.getElementById(
        "loginUsuario"
    ).value;

    const password =
    document.getElementById(
        "loginPassword"
    ).value;

    const { data, error } =
    await supabaseClient
    .from("nexus_wallet_users")
    .select("*")
    .eq("usuario",usuario)
    .eq("password",password);

    if(error || data.length === 0){

        alert("Datos incorrectos");
        return;

    }

    usuarioActual = data[0];

    actualizarWallet();

    mostrar("wallet");

    iniciarRefresco();

}

/* REFRESCO */

function iniciarRefresco(){

    setInterval(async()=>{

        if(!usuarioActual) return;

        const { data } =
        await supabaseClient
        .from("nexus_wallet_users")
        .select("*")
        .eq("id",usuarioActual.id);

        if(data && data.length > 0){

            usuarioActual = data[0];

            actualizarWallet();

        }

    },1000);

}

/* ACTUALIZAR */

function actualizarWallet(){

    document.getElementById(
        "saldoTexto"
    ).innerHTML =
    "$" + usuarioActual.saldo;

    document.getElementById(
        "usuarioCardNombre"
    ).innerHTML =
    usuarioActual.usuario;

    document.getElementById(
        "clabeInfoCard"
    ).innerHTML =
    usuarioActual.identificador;

    document.getElementById(
        "referenciaInfoCard"
    ).innerHTML =
    usuarioActual.referencia;

    document.getElementById(
        "saludoUsuario"
    ).innerHTML =
    "¡HOLA! BIENVENID@ " +
    usuarioActual.usuario;

}

/* MOSTRAR SECCIONES */

function mostrarPagoServicio(){

    mostrar("pagoServicio");

}

function mostrarTransferencia(){

    mostrar("transferencia");

}

function mostrarCanje(){

    mostrar("canje");

}

function volverWallet(){

    actualizarWallet();

    mostrar("wallet");

}

/* CONSULTAR SERVICIO */

async function consultarServicio(){

    const datoBusqueda =
    document.getElementById(
        "numeroServicioPago"
    ).value;

    let { data } =
    await supabaseClient
    .from("clientes_servicio")
    .select("*")
    .eq("numero_servicio",datoBusqueda);

    if(!data || data.length === 0){

        const respuesta =
        await supabaseClient
        .from("clientes_servicio")
        .select("*")
        .eq("numero_referencia",datoBusqueda);

        data = respuesta.data;

    }

    if(!data || data.length === 0){

        alert("Servicio no encontrado");

        return;

    }

    servicioActual = data[0];

    document.getElementById(
        "infoServicio"
    ).style.display = "block";

    document.getElementById(
        "saldoServicioTexto"
    ).innerHTML =
    "Saldo pendiente: $" +
    servicioActual.saldo;

    document.getElementById(
        "montoPago"
    ).value =
    servicioActual.saldo;

}

/* PAGAR */

async function pagarServicio(){

    if(!servicioActual){

        alert("Consulta primero");
        return;

    }

    const monto =
    Number(
        document.getElementById(
            "montoPago"
        ).value
    );

    if(monto <= 0){

        alert("Monto inválido");
        return;

    }

    if(monto > usuarioActual.saldo){

        alert("Saldo insuficiente");
        return;

    }

    const saldoNuevoWallet =
    Number(usuarioActual.saldo)
    - monto;

    await supabaseClient
    .from("nexus_wallet_users")
    .update({
        saldo:saldoNuevoWallet
    })
    .eq("id",usuarioActual.id);

    const saldoServicioNuevo =
    Number(servicioActual.saldo)
    - monto;

    await supabaseClient
    .from("clientes_servicio")
    .update({
        saldo:
        saldoServicioNuevo < 0
        ? 0
        : saldoServicioNuevo
    })
    .eq("id",servicioActual.id);

    usuarioActual.saldo =
    saldoNuevoWallet;

    actualizarWallet();

    generarPDF(
        "COMPROBANTE DE PAGO",
        [
            "Usuario: " +
            usuarioActual.usuario,

            "Servicio: " +
            servicioActual.numero_servicio,

            "Monto pagado: $" +
            monto
        ]
    );

    alert("Pago realizado");

    volverWallet();

}

/* TRANSFERENCIA */

async function hacerTransferencia(){

    const destino =
    document.getElementById(
        "destinoTransferencia"
    ).value;

    const monto =
    Number(
        document.getElementById(
            "montoTransferencia"
        ).value
    );

    if(destino === ""){

        alert(
            "Ingresa usuario, CLABE o referencia"
        );

        return;

    }

    if(monto <= 0){

        alert("Monto inválido");

        return;

    }

    if(monto > Number(usuarioActual.saldo)){

        alert("Saldo insuficiente");

        return;

    }

    let { data } =
    await supabaseClient
    .from("nexus_wallet_users")
    .select("*")
    .eq("usuario",destino);

    if(!data || data.length === 0){

        const r1 =
        await supabaseClient
        .from("nexus_wallet_users")
        .select("*")
        .eq("identificador",destino);

        data = r1.data;

    }

    if(!data || data.length === 0){

        const r2 =
        await supabaseClient
        .from("nexus_wallet_users")
        .select("*")
        .eq("referencia",destino);

        data = r2.data;

    }

    if(!data || data.length === 0){

        alert("Usuario no encontrado");

        return;

    }

    const receptor = data[0];

    const saldoNuevoEmisor =
    Number(usuarioActual.saldo)
    - monto;

    const saldoNuevoReceptor =
    Number(receptor.saldo)
    + monto;

    await supabaseClient
    .from("nexus_wallet_users")
    .update({
        saldo:saldoNuevoEmisor
    })
    .eq("id",usuarioActual.id);

    await supabaseClient
    .from("nexus_wallet_users")
    .update({
        saldo:saldoNuevoReceptor
    })
    .eq("id",receptor.id);

    usuarioActual.saldo =
    saldoNuevoEmisor;

    actualizarWallet();

    generarPDF(
        "COMPROBANTE DE TRANSFERENCIA",
        [
            "Emisor: " +
            usuarioActual.usuario,

            "Destino: " +
            destino,

            "Monto transferido: $" +
            monto
        ]
    );

    alert(
        "Transferencia realizada"
    );

    volverWallet();

}

/* CANJEAR */

async function canjearCodigo(){

    const codigo =
    document.getElementById(
        "codigoCanje"
    ).value;

    const { data } =
    await supabaseClient
    .from("codigos_saldo")
    .select("*")
    .eq("codigo",codigo)
    .eq("usado",false);

    if(!data || data.length === 0){

        alert("Código inválido");

        return;

    }

    const codigoData = data[0];

    const saldoNuevo =
    Number(usuarioActual.saldo)
    + Number(codigoData.saldo);

    await supabaseClient
    .from("nexus_wallet_users")
    .update({
        saldo:saldoNuevo
    })
    .eq("id",usuarioActual.id);

    await supabaseClient
    .from("codigos_saldo")
    .update({
        usado:true
    })
    .eq("id",codigoData.id);

    usuarioActual.saldo =
    saldoNuevo;

    actualizarWallet();

    generarPDF(
        "COMPROBANTE DE RECARGA",
        [
            "Usuario: " +
            usuarioActual.usuario,

            "Código: " +
            codigo,

            "Saldo agregado: $" +
            codigoData.saldo
        ]
    );

    alert(
        "Código canjeado correctamente"
    );

    volverWallet();

}

/* CERRAR */

function cerrarSesion(){

    usuarioActual = null;

    mostrar("inicio");

}

</script>

</body>
</html>
