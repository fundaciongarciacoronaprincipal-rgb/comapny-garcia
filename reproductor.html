<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Media</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
color:white;
padding:20px;
overflow-x:hidden;
}

.permission-screen{
position:fixed;
inset:0;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

.permission-box{
background:#111827;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,0.5);
}

.permission-box h1{
font-size:32px;
margin-bottom:20px;
color:#38bdf8;
}

.permission-box p{
color:#94a3b8;
margin-bottom:20px;
}

.permission-box button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

.section{
margin-top:30px;
background:#111827;
padding:20px;
border-radius:20px;
}

.section h2{
margin-bottom:20px;
color:#38bdf8;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:15px;
}

.item{
background:#1e293b;
padding:15px;
border-radius:14px;
overflow:hidden;
}

.item video,
.item audio{
width:100%;
margin-top:10px;
border-radius:10px;
}

.file-name{
font-size:13px;
word-break:break-all;
margin-bottom:10px;
}

.empty{
color:#94a3b8;
}

</style>
</head>

<body>

<div class="permission-screen" id="permissionScreen">

<div class="permission-box">

<h1>Scanner Media</h1>

<p>
Permite acceso para escanear archivos multimedia del dispositivo.
</p>

<button onclick="startScan()">
Permitir Escaneo
</button>

</div>

</div>

<div class="section">

<h2>🎵 MP3</h2>

<div class="grid" id="mp3List">

<div class="empty">
No se encontraron MP3
</div>

</div>

</div>

<div class="section">

<h2>🎬 Videos MP4</h2>

<div class="grid" id="mp4List">

<div class="empty">
No se encontraron videos
</div>

</div>

</div>

<div class="section">

<h2>🟢 Audios WhatsApp</h2>

<div class="grid" id="waList">

<div class="empty">
No se encontraron audios WhatsApp
</div>

</div>

</div>

<script>

async function startScan(){

try{

const directory =
await window.showDirectoryPicker();

document
.getElementById("permissionScreen")
.style.display = "none";

scanFiles(directory);

}catch(err){

alert("Permiso denegado");

}

}

async function scanFiles(folder){

const mp3List =
document.getElementById("mp3List");

const mp4List =
document.getElementById("mp4List");

const waList =
document.getElementById("waList");

mp3List.innerHTML = "";
mp4List.innerHTML = "";
waList.innerHTML = "";

let mp3Found = false;
let mp4Found = false;
let waFound = false;

async function readFolder(dir){

for await(const entry of dir.values()){

if(entry.kind === "file"){

const file =
await entry.getFile();

const url =
URL.createObjectURL(file);

const name =
file.name.toLowerCase();

if(name.endsWith(".mp3")){

mp3Found = true;

const div =
document.createElement("div");

div.className = "item";

div.innerHTML = `
<div class="file-name">
${file.name}
</div>

<audio controls>
<source src="${url}">
</audio>
`;

mp3List.appendChild(div);

}

else if(name.endsWith(".mp4")){

mp4Found = true;

const div =
document.createElement("div");

div.className = "item";

div.innerHTML = `
<div class="file-name">
${file.name}
</div>

<video controls>
<source src="${url}">
</video>
`;

mp4List.appendChild(div);

}

else if(
name.includes("whatsapp") ||
name.includes("ptt") ||
name.endsWith(".opus") ||
name.endsWith(".ogg")
){

waFound = true;

const div =
document.createElement("div");

div.className = "item";

div.innerHTML = `
<div class="file-name">
${file.name}
</div>

<audio controls>
<source src="${url}">
</audio>
`;

waList.appendChild(div);

}

}

if(entry.kind === "directory"){

await readFolder(entry);

}

}

}

await readFolder(folder);

if(!mp3Found){

mp3List.innerHTML =
'<div class="empty">No se encontraron MP3</div>';

}

if(!mp4Found){

mp4List.innerHTML =
'<div class="empty">No se encontraron videos</div>';

}

if(!waFound){

waList.innerHTML =
'<div class="empty">No se encontraron audios WhatsApp</div>';

}

}

</script>

</body>
</html>
