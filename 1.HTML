<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lector Seguro PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:95%;
    max-width:800px;
    text-align:center;
}

/* SCANNER */
#scanner{
    background:white;
    padding:10px;
    border-radius:10px;
}

/* INPUTS */
input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:15px;
}

button{
    cursor:pointer;
    font-weight:bold;
}

/* SECCIONES */
#auth, #resultBox{
    display:none;
}

/* RESULTADO */
#resultBox{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    white-space:pre-wrap;
    text-align:left;
}

/* BOTON VOLVER */
#restartBtn{
    margin-top:15px;
    background:#3b82f6;
}

.small{
    font-size:13px;
    opacity:0.7;
}

</style>
</head>

<body>

<div class="box">

<h2>🔐 Lector Seguro</h2>

<!-- SCANNER -->
<div id="scanner"></div>

<p class="small">o escribe el código manualmente</p>

<input id="manualId" placeholder="Código de 30 dígitos">
<button onclick="usarManual()">Buscar código</button>

<!-- CONTRASEÑA -->
<div id="auth">
    <input id="pass" type="password" placeholder="Contraseña">
    <button onclick="descifrar()">Descifrar</button>
</div>

<!-- RESULTADO -->
<div id="resultBox"></div>

<button id="restartBtn" onclick="reiniciar()">Escanear otro código</button>

</div>

<script>

const supabaseClient = window.supabase.createClient(
  "https://etluxtltuwjsnwevlany.supabase.co",
  "sb_publishable_rDUR-NjwHiLNJKHBVYMriw_KfxdMKzd"
);

let docID = "";
let cifrado = "";
let scanner;

// 📷 INICIAR SCANNER
function iniciarScanner(){

    scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode:"environment" },
        { fps:10, qrbox:250 },
        (text)=>{

            procesarCodigo(text);

        }
    );

}

iniciarScanner();

// 🔁 PROCESAR CODIGO (QR O MANUAL)
function procesarCodigo(text){

    docID = text;

    // 🧼 ocultar todo
    document.getElementById("scanner").style.display="none";
    document.getElementById("manualId").style.display="none";
    document.querySelector(".small").style.display="none";

    scanner.stop();

    document.getElementById("auth").style.display="block";

}

// 🔍 MANUAL
function usarManual(){

    const id = document.getElementById("manualId").value;

    if(!id){
        alert("Escribe el código");
        return;
    }

    procesarCodigo(id);
}

// 🔓 DESCIFRAR
async function descifrar(){

    const pass = document.getElementById("pass").value;

    if(!docID){
        alert("No hay código");
        return;
    }

    const { data, error } = await supabaseClient
        .from("documentos")
        .select("data")
        .eq("id", docID)
        .single();

    if(error || !data){
        alert("No encontrado");
        return;
    }

    cifrado = data.data;

    const bytes = CryptoJS.AES.decrypt(cifrado, pass);
    const texto = bytes.toString(CryptoJS.enc.Utf8);

    if(!texto){
        alert("Contraseña incorrecta");
        return;
    }

    // 🧼 ocultar todo otra vez
    document.getElementById("auth").style.display="none";

    // mostrar resultado
    document.getElementById("resultBox").style.display="block";
    document.getElementById("resultBox").textContent = texto;

    document.getElementById("restartBtn").style.display="block";

}

// 🔄 REINICIAR TODO
function reiniciar(){

    docID = "";
    cifrado = "";

    document.getElementById("resultBox").style.display="none";
    document.getElementById("restartBtn").style.display="none";
    document.getElementById("pass").value = "";

    document.getElementById("scanner").style.display="block";
    document.getElementById("manualId").style.display="block";
    document.querySelector(".small").style.display="block";

    document.getElementById("auth").style.display="none";

    iniciarScanner();

}

</script>

</body>
</html>
