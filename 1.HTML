<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector QR Auto Cámara</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.contenedor{
    width:95%;
    max-width:900px;
    text-align:center;
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
}

#passwordSection,
#resultadoSection{
    display:none;
}

input{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:#22c55e;
    color:white;
}

#msg{
    margin-bottom:10px;
    opacity:0.8;
}

#resultado{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.08);
    white-space:pre-wrap;
    text-align:left;
}

</style>
</head>

<body>

<div class="contenedor">

<h2>📷 Escaneando QR...</h2>

<div id="msg">Solicitando permiso de cámara...</div>

<div id="reader"></div>

<div id="passwordSection">

    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="descifrarTexto()">
        Descifrar
    </button>

</div>

<div id="resultadoSection">
    <div id="resultado"></div>
</div>

</div>

<script>

//////////////////////////////
// 🔥 SUPABASE
//////////////////////////////

const supabase = window.supabase.createClient(
  "https://etluxtltuwjsnwevlany.supabase.co",
  "sb_publishable_rDUR-NjwHiLNJKHBVYMriw_KfxdMKzd"
);

let textoCifrado = "";
let scanner;

//////////////////////////////
// 📷 AUTO INICIAR CÁMARA
//////////////////////////////

async function iniciarCamaraAuto(){

    try{

        scanner = new Html5Qrcode("reader");

        document.getElementById("msg").innerText =
        "📷 Pidiendo permiso de cámara...";

        await scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: 250
            },
            async (decodedText)=>{

                const docID = decodedText;

                const { data, error } = await supabase
                    .from("documentos")
                    .select("data")
                    .eq("id", docID)
                    .single();

                if(error || !data){
                    alert("No encontrado en Supabase");
                    return;
                }

                textoCifrado = data.data;

                await scanner.stop();

                document.getElementById("reader").style.display="none";
                document.getElementById("msg").style.display="none";
                document.getElementById("passwordSection").style.display="block";

            }
        );

        document.getElementById("msg").innerText =
        "📷 Cámara activa, escanea el QR";

    }catch(err){

        console.log(err);

        document.getElementById("msg").innerText =
        "❌ No se pudo acceder a la cámara (usa HTTPS o permite permisos)";

    }

}

//////////////////////////////
// 🔓 DESCIFRAR
//////////////////////////////

function descifrarTexto(){

    const pass = document.getElementById("password").value;

    const bytes = CryptoJS.AES.decrypt(textoCifrado, pass);
    const text = bytes.toString(CryptoJS.enc.Utf8);

    if(!text){
        alert("Contraseña incorrecta");
        return;
    }

    document.getElementById("passwordSection").style.display="none";
    document.getElementById("resultadoSection").style.display="block";
    document.getElementById("resultado").textContent = text;

}

//////////////////////////////
// 🚀 INICIAR AUTOMÁTICO
//////////////////////////////

iniciarCamaraAuto();

</script>

</body>
</html>
