<!--PARTE A-->
<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lector MultiQR Seguro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.contenedor{
    width:100%;
    max-width:900px;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

.panel{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto;
    border-radius:15px;
    overflow:hidden;
    background:white;
}

.estado{
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

#btnDescifrar{
    background:#22c55e;
    color:white;
    display:none;
}

#panelPassword{
    display:none;
}

#resultado{
    display:none;
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.2);
    text-align:left;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="contenedor">

<h1>🔓 Lector de Documentos Multi-QR</h1>

<div class="panel">

<div id="reader"></div>

<div class="estado" id="estado">
Escanea el primer QR
</div>

</div>

<div id="panelPassword">

<input type="password" id="password" placeholder="Introduce la contraseña">

<button id="btnDescifrar">
Descifrar Documento
</button>

</div>

<div id="resultado"></div>

<script>

let scanner;

let documentoID = null;

let totalPartes = 0;

let partesRecibidas = {};

let contador = 0;

let datosCompletos = "";

function iniciarScanner(){

    scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 250
        },
        onScan
    ).catch(err=>{
        console.log(err);
    });

}

function onScan(texto){

    procesarQR(texto);

}
<!--PARTE B-->
function procesarQR(texto){

    // Formato esperado:
    // DOCID|parte|total|datos

    const partes =
    texto.split("|");

    if(partes.length < 4){
        return;
    }

    const id = partes[0];
    const parteActual = parseInt(partes[1]);
    const total = parseInt(partes[2]);
    const datos = partes.slice(3).join("|");

    // Primera lectura
    if(!documentoID){

        documentoID = id;
        totalPartes = total;

        partesRecibidas = {};

        document.getElementById("estado").innerHTML =
        "Documento detectado: " + id +
        "<br>Escaneados: 0 / " + total;

    }

    // Validar mismo documento
    if(id !== documentoID){
        document.getElementById("estado").innerHTML =
        "❌ Este QR no pertenece al documento actual";
        return;
    }

    // Guardar parte
    partesRecibidas[parteActual] = datos;

    contador = Object.keys(partesRecibidas).length;

    document.getElementById("estado").innerHTML =
    "Documento: " + documentoID +
    "<br>Escaneados: " + contador + " / " + totalPartes;

    // Si ya tenemos todas las partes
    if(contador === totalPartes){

        scanner.stop();

        reconstruirDocumento();

    }

}

function reconstruirDocumento(){

    let ordenado = "";

    for(let i = 1; i <= totalPartes; i++){

        ordenado += partesRecibidas[i];

    }

    datosCompletos = ordenado;

    document.getElementById("estado").innerHTML =
    "✔ Documento completo. Ingresa la contraseña.";

    document.getElementById("panelPassword").style.display =
    "block";

}
<!--PARTE C-->
document.getElementById("btnDescifrar").onclick = function(){

    const password =
    document.getElementById("password").value;

    if(!password){
        alert("Introduce la contraseña");
        return;
    }

    try{

        const bytes =
        CryptoJS.AES.decrypt(
            datosCompletos,
            password
        );

        const texto =
        bytes.toString(
            CryptoJS.enc.Utf8
        );

        if(!texto){

            alert("Contraseña incorrecta o datos dañados");
            return;

        }

        mostrarResultado(texto);

    }catch(err){

        console.log(err);
        alert("Error al descifrar");

    }

};

function mostrarResultado(texto){

    document.getElementById("reader").style.display =
    "none";

    document.getElementById("panelPassword").style.display =
    "none";

    document.getElementById("estado").style.display =
    "none";

    const resultado =
    document.getElementById("resultado");

    resultado.style.display =
    "block";

    resultado.textContent =
    texto;

}
<!--PARTE D FINAL-->
function reiniciarSistema(){

    documentoID = null;
    totalPartes = 0;
    partesRecibidas = {};
    contador = 0;
    datosCompletos = "";

    document.getElementById("resultado").style.display = "none";
    document.getElementById("panelPassword").style.display = "none";

    document.getElementById("estado").style.display = "block";
    document.getElementById("estado").innerHTML =
    "Escanea el primer QR";

    document.getElementById("reader").style.display = "block";

    iniciarScanner();

}

// Botón opcional de reinicio (puedes agregarlo si quieres)
const btnReset = document.createElement("button");

btnReset.innerHTML = "Reiniciar escaneo";
btnReset.style.background = "#3b82f6";
btnReset.style.color = "white";

btnReset.style.marginTop = "15px";

btnReset.onclick = reiniciarSistema;

document.querySelector(".panel").appendChild(btnReset);

// Iniciar automáticamente el escáner al cargar
window.onload = function(){
    iniciarScanner();
};

</script>

</div>

</body>
</html>
