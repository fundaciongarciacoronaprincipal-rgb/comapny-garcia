<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lector Seguro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:95%;
    max-width:800px;
    text-align:center;
}

#scanner{
    background:white;
    padding:10px;
    border-radius:10px;
}

input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:15px;
}

button{
    cursor:pointer;
    font-weight:bold;
}

#auth{
    display:none;
}

#result{
    display:none;
    margin-top:20px;
    padding:20px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:15px;
    white-space:pre-wrap;
    text-align:left;
}

h2{
    margin-bottom:10px;
}

.small{
    font-size:13px;
    opacity:0.7;
}

</style>
</head>

<body>

<div class="box">

<h2>🔍 Lector de Documentos Seguros</h2>

<!-- ESCANER -->
<div id="scanner"></div>

<p class="small">o escribe el código manualmente</p>

<!-- BUSQUEDA MANUAL -->
<input id="manualId" placeholder="Código de 30 caracteres">
<button onclick="buscarManual()">Buscar código</button>

<!-- CONTRASEÑA -->
<div id="auth">
    <input id="pass" type="password" placeholder="Contraseña">
    <button onclick="descifrar()">Descifrar documento</button>
</div>

<!-- RESULTADO -->
<div id="result"></div>

</div>

<script>

// 🔥 CONEXIÓN SUPABASE
const supabaseClient = window.supabase.createClient(
  "https://etluxtltuwjsnwevlany.supabase.co",
  "sb_publishable_rDUR-NjwHiLNJKHBVYMriw_KfxdMKzd"
);

let docID = "";
let cifrado = "";

// 📷 ESCANER QR
const scanner = new Html5Qrcode("scanner");

scanner.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  (decodedText) => {

    docID = decodedText;

    scanner.stop();

    document.getElementById("scanner").style.display = "none";
    document.getElementById("auth").style.display = "block";

  }
);

// 🔍 BUSQUEDA MANUAL
async function buscarManual(){

    const id = document.getElementById("manualId").value;

    if(!id){
        alert("Escribe el código");
        return;
    }

    docID = id;

    await scanner.stop();

    document.getElementById("scanner").style.display = "none";
    document.getElementById("auth").style.display = "block";

}

// 🔓 DESCIFRAR
async function descifrar(){

    const pass = document.getElementById("pass").value;

    if(!docID){
        alert("No hay documento seleccionado");
        return;
    }

    const { data, error } = await supabaseClient
        .from("documentos")
        .select("data")
        .eq("id", docID)
        .single();

    if(error || !data){
        alert("Documento no encontrado");
        console.log(error);
        return;
    }

    cifrado = data.data;

    const bytes = CryptoJS.AES.decrypt(cifrado, pass);
    const texto = bytes.toString(CryptoJS.enc.Utf8);

    if(!texto){
        alert("Contraseña incorrecta");
        return;
    }

    // 🧼 ocultar todo
    document.getElementById("auth").style.display = "none";
    document.getElementById("scanner").style.display = "none";
    document.getElementById("manualId").style.display = "none";

    // mostrar resultado
    document.getElementById("result").style.display = "block";
    document.getElementById("result").textContent = texto;

}

</script>

</body>
</html>
