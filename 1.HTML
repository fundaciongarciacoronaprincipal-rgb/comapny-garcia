<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector QR PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:95%;
    max-width:800px;
    text-align:center;
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    background:#3b82f6;
    color:white;
}

#auth{
    display:none;
}

#result{
    display:none;
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.08);
    white-space:pre-wrap;
    text-align:left;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="box">

<h2>📷 Lector QR Seguro</h2>

<button onclick="startScanner()">
    Iniciar cámara
</button>

<div id="reader"></div>

<div id="auth">

    <input type="password" id="pass" placeholder="Contraseña">

    <button onclick="decrypt()">
        Descifrar
    </button>

</div>

<div id="result"></div>

</div>

<script>

//////////////////////////////
// 🔥 SUPABASE
//////////////////////////////

const supabase = window.supabase.createClient(
  "https://etluxtltuwjsnwevlany.supabase.co",
  "sb_publishable_rDUR-NjwHiLNJKHBVYMriw_KfxdMKzd"
);

let scanner;
let encryptedText = "";

//////////////////////////////
// 📷 SCANNER
//////////////////////////////

async function startScanner(){

    try{

        scanner = new Html5Qrcode("reader");

        await scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: 250
            },
            async (text)=>{

                const docID = text;

                const { data, error } = await supabase
                    .from("documentos")
                    .select("data")
                    .eq("id", docID)
                    .single();

                if(error || !data){
                    alert("No encontrado en Supabase");
                    console.log(error);
                    return;
                }

                encryptedText = data.data;

                await scanner.stop();

                document.getElementById("auth").style.display = "block";

            }
        );

    }catch(err){
        console.log(err);
        alert("No se pudo abrir la cámara. Usa HTTPS o Live Server.");
    }

}

//////////////////////////////
// 🔓 DESCIFRAR
//////////////////////////////

function decrypt(){

    const pass = document.getElementById("pass").value;

    const bytes = CryptoJS.AES.decrypt(encryptedText, pass);
    const text = bytes.toString(CryptoJS.enc.Utf8);

    if(!text){
        alert("Contraseña incorrecta");
        return;
    }

    document.getElementById("auth").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("result").textContent = text;

}

</script>

</body>
</html>
