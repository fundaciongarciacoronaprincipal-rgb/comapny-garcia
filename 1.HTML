<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descifrar QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.contenedor{
    width:95%;
    max-width:900px;
    text-align:center;
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    display:none;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    background:#22c55e;
    color:white;
}

#passwordSection,
#resultadoSection{
    display:none;
}

input{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
}

#resultado{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.08);
    white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="contenedor">

<h2>📷 Lector QR</h2>

<!-- BOTÓN OBLIGATORIO -->
<button onclick="startCamera()">
    Iniciar cámara
</button>

<div id="reader"></div>

<div id="passwordSection">

    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="descifrarTexto()">
        Descifrar
    </button>

</div>

<div id="resultadoSection">
    <div id="resultado"></div>
</div>

</div>

<script>

const supabase = window.supabase.createClient(
  "https://etluxtltuwjsnwevlany.supabase.co",
  "sb_publishable_rDUR-NjwHiLNJKHBVYMriw_KfxdMKzd"
);

let scanner;
let textoCifrado = "";
let docID = "";

async function startCamera(){

    try{

        document.getElementById("reader").style.display = "block";

        scanner = new Html5Qrcode("reader");

        await scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: 250
            },
            async (text)=>{

                docID = text;

                const { data, error } = await supabase
                    .from("documentos")
                    .select("data")
                    .eq("id", docID)
                    .single();

                if(error || !data){
                    alert("No encontrado en Supabase");
                    return;
                }

                textoCifrado = data.data;

                await scanner.stop();

                document.getElementById("passwordSection").style.display = "block";

            }
        );

    }catch(err){

        console.log(err);

        alert("❌ No se pudo abrir la cámara. Usa HTTPS o Live Server.");

    }
}

function descifrarTexto(){

    const pass = document.getElementById("password").value;

    const bytes = CryptoJS.AES.decrypt(textoCifrado, pass);
    const text = bytes.toString(CryptoJS.enc.Utf8);

    if(!text){
        alert("Contraseña incorrecta");
        return;
    }

    document.getElementById("passwordSection").style.display = "none";
    document.getElementById("resultadoSection").style.display = "block";
    document.getElementById("resultado").textContent = text;

}

</script>

</body>
</html>
