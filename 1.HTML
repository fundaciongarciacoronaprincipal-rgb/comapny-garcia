<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector QR Seguro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:95%;
    max-width:800px;
    text-align:center;
}

/* Scanner */
#reader{
    background:white;
    border-radius:15px;
    overflow:hidden;
}

/* Password */
#auth{
    display:none;
    margin-top:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#22c55e;
    color:white;
}

/* Resultado transparente */
#result{
    display:none;
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    white-space:pre-wrap;
    text-align:left;
}

h2{
    margin-bottom:15px;
}

</style>
</head>

<body>

<div class="box">

<h2>📷 Escanea el QR</h2>

<div id="reader"></div>

<div id="auth">

    <h3>🔐 Contraseña</h3>

    <input type="password" id="pass" placeholder="Introduce contraseña">

    <button onclick="descifrar()">
        🔓 Descifrar documento
    </button>

</div>

<div id="result"></div>

</div>

<script>

// 🔥 SUPABASE CONECTADO
const supabase = window.supabase.createClient(
  "https://etluxtltuwjsnwevlany.supabase.co",
  "sb_publishable_rDUR-NjwHiLNJKHBVYMriw_KfxdMKzd"
);

let docID = "";
let cifrado = "";

// 📷 Scanner
const scanner = new Html5Qrcode("reader");

scanner.start(
  { facingMode: "environment" },
  {
    fps: 10,
    qrbox: 250
  },
  async (text) => {

    docID = text;

    await scanner.stop();

    document.getElementById("reader").style.display = "none";
    document.getElementById("auth").style.display = "block";

  }
);

// 🔓 DESCIFRAR
async function descifrar(){

    const pass = document.getElementById("pass").value;

    if(!pass){
        alert("Escribe la contraseña");
        return;
    }

    // 🔎 Buscar en Supabase
    const { data, error } = await supabase
        .from("documentos")
        .select("data")
        .eq("id", docID)
        .single();

    if(error || !data){
        alert("Documento no encontrado");
        console.log(error);
        return;
    }

    cifrado = data.data;

    const bytes = CryptoJS.AES.decrypt(cifrado, pass);
    const texto = bytes.toString(CryptoJS.enc.Utf8);

    if(!texto){
        alert("Contraseña incorrecta");
        return;
    }

    // 🧊 ocultar todo y mostrar resultado
    document.getElementById("auth").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("result").textContent = texto;

}

</script>

</body>
</html>
