<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector Híbrido QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:95%;
    max-width:800px;
    text-align:center;
}

#reader{
    width:100%;
    max-width:450px;
    margin:auto;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#3b82f6;
    color:white;
}

.green{
    background:#22c55e;
    color:white;
}

input{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
}

#manualBox,
#auth,
#result{
    display:none;
    margin-top:15px;
}

#result{
    padding:20px;
    background:rgba(255,255,255,0.08);
    border-radius:10px;
    white-space:pre-wrap;
    text-align:left;
}

</style>
</head>

<body>

<div class="box">

<h2>📷 Lector híbrido</h2>

<button class="primary" onclick="startCamera()">
    Iniciar cámara QR
</button>

<button class="primary" onclick="showManual()">
    Ingresar código manualmente
</button>

<div id="reader"></div>

<!-- MANUAL -->
<div id="manualBox">

    <h3>✍️ Código manual (escáner externo)</h3>

    <input type="text" id="manualCode" placeholder="Escanea o escribe código">

    <button class="green" onclick="processCode()">
        Buscar documento
    </button>

</div>

<!-- PASSWORD -->
<div id="auth">

    <input type="password" id="pass" placeholder="Contraseña">

    <button class="green" onclick="decrypt()">
        Descifrar
    </button>

</div>

<!-- RESULT -->
<div id="result"></div>

</div>

<script>

//////////////////////////////
// SUPABASE
//////////////////////////////

const supabase = window.supabase.createClient(
  "https://etluxtltuwjsnwevlany.supabase.co",
  "sb_publishable_rDUR-NjwHiLNJKHBVYMriw_KfxdMKzd"
);

let scanner;
let encryptedText = "";
let docID = "";

//////////////////////////////
// CÁMARA
//////////////////////////////

async function startCamera(){

    try{

        document.getElementById("manualBox").style.display="none";

        scanner = new Html5Qrcode("reader");

        await scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            async (text)=>{

                await scanner.stop();

                docID = text;

                await loadFromSupabase(docID);

            }
        );

    }catch(err){
        console.log(err);
        alert("Error cámara");
    }

}

//////////////////////////////
// MANUAL
//////////////////////////////

function showManual(){

    document.getElementById("manualBox").style.display="block";
    document.getElementById("reader").innerHTML="";

}

async function processCode(){

    const code = document.getElementById("manualCode").value;

    if(!code){
        alert("Ingresa un código");
        return;
    }

    docID = code;

    await loadFromSupabase(docID);

}

//////////////////////////////
// SUPABASE LOAD
//////////////////////////////

async function loadFromSupabase(id){

    const { data, error } = await supabase
        .from("documentos")
        .select("data")
        .eq("id", id)
        .single();

    if(error || !data){
        console.log(error);
        alert("No encontrado en Supabase");
        return;
    }

    encryptedText = data.data;

    document.getElementById("auth").style.display="block";

}

//////////////////////////////
// DESCIFRAR
//////////////////////////////

function decrypt(){

    const pass = document.getElementById("pass").value;

    const bytes = CryptoJS.AES.decrypt(encryptedText, pass);
    const text = bytes.toString(CryptoJS.enc.Utf8);

    if(!text){
        alert("Contraseña incorrecta");
        return;
    }

    document.getElementById("auth").style.display="none";
    document.getElementById("result").style.display="block";
    document.getElementById("result").textContent = text;

}

</script>

</body>
</html>
