<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ver Sistema</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body {
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#0f172a,#020617);
    color:white;
}

/* 🔥 PANTALLA COMPLETA REAL */
.container {
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* panel principal */
.card {
    width:100%;
    height:100%;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}

/* título */
h2 {
    font-size:28px;
    margin-bottom:20px;
    color:#38bdf8;
}

/* contenido */
.box {
    background: rgba(255,255,255,0.05);
    padding:20px;
    border-radius:12px;
    width:90%;
    max-width:700px;
    font-size:18px;
    line-height:1.8;
    word-break:break-word;
}

/* error */
.error {
    color:#f87171;
    font-size:18px;
}

/* debug */
.debug {
    margin-top:15px;
    font-size:12px;
    color:#fbbf24;
    opacity:0.8;
}

/* 📱 tablet */
@media (max-width: 768px) {
    h2 {
        font-size:22px;
    }

    .box {
        font-size:16px;
    }
}

/* 📱 celular */
@media (max-width: 480px) {
    h2 {
        font-size:18px;
    }

    .box {
        font-size:14px;
        width:95%;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <h2>📄 Sistema</h2>

        <div id="content" class="box">Cargando...</div>
        <div id="debug" class="debug"></div>
    </div>
</div>

<script>
const supabaseUrl = "https://guefunmlvfwvbrqnmbsn.supabase.co";
const supabaseKey = "sb_publishable_YdagTcFfjPpmUKJPJC2gdQ_5HjUIwjy";

const client = supabase.createClient(supabaseUrl, supabaseKey);

// obtener id de URL
const id = new URLSearchParams(window.location.search).get("id");

function log(msg){
    document.getElementById("debug").innerText = "DEBUG: " + msg;
}

async function cargar(){

    if(!id){
        document.getElementById("content").innerHTML =
            "<div class='error'>No hay ID en el link</div>";
        log("Falta ID");
        return;
    }

    log("Buscando ID: " + id);

    const { data, error } = await client
        .from("sistemas")
        .select("*")
        .eq("id", id)
        .maybeSingle();

    if(error){
        document.getElementById("content").innerHTML =
            "<div class='error'>Error en Supabase</div>";
        log("Error Supabase");
        return;
    }

    if(!data){
        document.getElementById("content").innerHTML =
            "<div class='error'>No encontrado</div>";
        log("ID no existe");
        return;
    }

    document.getElementById("content").innerHTML = `
        <b>Sistema:</b> ${data.sistema}<br><br>
        <b>Código:</b> ${data.codigo}<br><br>
        <b>Titular:</b> ${data.titular}
    `;

    log("OK cargado");
}

cargar();
</script>

</body>
</html>
