<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top,#0f172a,#020617);
    overflow:hidden;
}

/* fondo animado */
body::before {
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    background:linear-gradient(45deg,#38bdf8,#22c55e,#a855f7);
    filter:blur(120px);
    animation:move 8s infinite alternate;
    z-index:0;
}

@keyframes move {
    0% { transform:translate(-200px,-200px); }
    100% { transform:translate(200px,200px); }
}

.card {
    position:relative;
    z-index:1;
    width:360px;
    padding:25px;
    border-radius:18px;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border:1px solid rgba(255,255,255,0.15);

    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    color:white;
}

h2 {
    text-align:center;
    margin-bottom:15px;
    font-size:22px;
    background: linear-gradient(90deg,#38bdf8,#a855f7);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

input {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:none;
    outline:none;
    background: rgba(255,255,255,0.1);
    color:white;
}

input::placeholder {
    color:#cbd5e1;
}

button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background: linear-gradient(90deg,#38bdf8,#22c55e);
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover {
    transform:scale(1.03);
}

.link {
    margin-top:10px;
    font-size:12px;
    word-break:break-all;
    color:#93c5fd;
}

.debug {
    margin-top:10px;
    font-size:12px;
    color:#fca5a5;
    opacity:0.9;
}
</style>
</head>

<body>

<div class="card">
    <h2>⚡ Sistema PRO</h2>

    <input id="sistema" placeholder="Nombre del sistema">
    <input id="codigo" placeholder="Código">
    <input id="titular" placeholder="Titular">

    <button onclick="guardar()">Guardar y generar link</button>

    <div class="link" id="link"></div>
    <button onclick="copiar()">Copiar link</button>

    <div class="debug" id="debug"></div>
</div>

<script>
const supabaseUrl = "https://guefunmlvfwvbrqnmbsn.supabase.co";
const supabaseKey = "sb_publishable_YdagTcFfjPpmUKJPJC2gdQ_5HjUIwjy";
const client = supabase.createClient(supabaseUrl, supabaseKey);

let linkFinal = "";

function log(msg){
    document.getElementById("debug").innerText = "⚠ " + msg;
}

function id(){
    return crypto.randomUUID().slice(0,8);
}

async function guardar(){

    const sistema = document.getElementById("sistema").value;
    const codigo = document.getElementById("codigo").value;
    const titular = document.getElementById("titular").value;

    if(!sistema || !codigo || !titular){
        log("Completa todos los campos");
        return;
    }

    const newId = id();

    const { error } = await client.from("sistemas").insert([{
        id: newId,
        sistema,
        codigo,
        titular
    }]);

    if(error){
        console.log(error);
        log("Error al guardar en Supabase");
        return;
    }

    linkFinal = window.location.origin + "/ver.html?id=" + newId;

    document.getElementById("link").innerText = "🔗 " + linkFinal;

    log("Guardado correctamente");
}

function copiar(){
    if(!linkFinal){
        log("No hay link generado");
        return;
    }

    navigator.clipboard.writeText(linkFinal);
    log("Link copiado");
}
</script>

</body>
</html>
