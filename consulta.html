<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de Adeudo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#87CEEB;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:400px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.buscar{
    background:#007BFF;
    color:white;
}

.confirmar{
    background:#28a745;
    color:white;
}

.pagos{
    display:none;
    margin-top:20px;
}

.pago-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:#f1f1f1;
    color:black;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
    font-weight:bold;
}

.pago-btn img{
    width:30px;
}

</style>
</head>
<body>

<div class="container">

<h2>Consulta de Adeudo</h2>

<input type="text" id="busqueda" placeholder="Número de servicio o referencia">

<button class="buscar" onclick="buscar()">
Buscar
</button>

<div id="resultado"></div>

<div class="pagos" id="pagos">

<h3 id="saldoTexto"></h3>

<a class="pago-btn" href="TU_LINK_PAYPAL" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/174/174861.png">
PayPal
</a>

<a class="pago-btn" href="TU_LINK_CLIP" target="_blank">
<img src="https://seeklogo.com/images/C/clip-logo-3D5CE6E30B-seeklogo.com.png">
Clip
</a>

<a class="pago-btn" href="TU_LINK_MERCADOPAGO" target="_blank">
<img src="https://logodownload.org/wp-content/uploads/2019/06/mercado-pago-logo.png">
Mercado Pago
</a>

<a class="pago-btn" href="TU_LINK_TRANSFERENCIA" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png">
Transferencia
</a>

</div>

</div>

<script>

const SUPABASE_URL = "https://ieaielptonscbsimbtyx.supabase.co";

const SUPABASE_KEY = "sb_publishable_pmJ3fN_2FUKM1AskoReusA_0vaZz7f_";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let clienteActual = null;

async function buscar(){

    const valor = document.getElementById("busqueda").value;

    const { data, error } = await supabaseClient
    .from("clientes_servicio")
    .select("*")
    .or(`numero_servicio.eq.${valor},numero_referencia.eq.${valor}`);

    if(error || data.length === 0){

        document.getElementById("resultado").innerHTML =
        "<p>No encontrado</p>";

        return;
    }

    clienteActual = data[0];

    document.getElementById("resultado").innerHTML = `
        <p>
        Cliente encontrado:
        <b>${clienteActual.iniciales}</b>
        </p>

        <button class="confirmar" onclick="confirmar()">
        Confirmar
        </button>
    `;

}

function confirmar(){

    document.getElementById("saldoTexto").innerHTML =
    `Saldo pendiente: <b>$${clienteActual.saldo}</b>`;

    document.getElementById("pagos").style.display = "block";

}

</script>

</body>
</html>
