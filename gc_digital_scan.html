<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Scanner Azul Rey</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode"></script>

<style>

body{
margin:0;
font-family:Arial;
background:white;
text-align:center;
}

/* MENU */
.menu{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:#0047AB;
transition:.3s;
padding-top:60px;
}

.menu a{
display:block;
padding:15px;
color:white;
text-decoration:none;
border-bottom:1px solid rgba(255,255,255,.2);
}

.menu.active{left:0;}

/* TOPBAR */
.topbar{
height:60px;
background:#0047AB;
color:white;
display:flex;
align-items:center;
padding-left:15px;
font-size:24px;
}

/* CONTENIDO */
.content{
padding:20px;
}

/* SCANNER */
.scanner-box{
position:relative;
margin:auto;
width:260px;
height:260px;
border:4px solid #0047AB;
border-radius:15px;
overflow:hidden;
background:white;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.scan-line{
position:absolute;
width:100%;
height:3px;
background:red;
animation:scan 1.5s linear infinite;
}

@keyframes scan{
0%{top:0;}
50%{top:50%;}
100%{top:100%;}
}

/* INPUTS */
input,textarea{
width:90%;
max-width:300px;
padding:10px;
margin:8px;
border-radius:8px;
border:1px solid #ccc;
}

/* BOTONES */
button{
background:#0047AB;
color:white;
border:none;
padding:12px 20px;
border-radius:20px;
margin:5px;
}

#qrcode,#miqrcode{
background:white;
padding:10px;
display:flex;
justify-content:center;
}

svg{
background:white;
margin-top:10px;
}

</style>
</head>

<body>

<div class="menu" id="menu">
<a onclick="mostrar('scan')">📷 Escanear</a>
<a onclick="mostrar('crear')">➕ Crear QR</a>
<a onclick="mostrar('barcode')">🏷 Código Barras</a>
<a onclick="mostrar('miqr')">👤 Mi Código QR</a>
</div>

<div class="topbar">
<span onclick="toggleMenu()">☰</span>
</div>

<div class="content">

<!-- ESCANER -->
<div id="scan">
<h2>Escáner</h2>

<div class="scanner-box">
<video id="video"></video>
<div class="scan-line"></div>
</div>

<p id="resultado">Escaneando rápido...</p>
</div>

<!-- CREAR QR -->
<div id="crear" style="display:none;">
<h2>Crear QR</h2>

<input id="qrtext" placeholder="Link, texto, WiFi o datos">
<br>
<button onclick="crearQR()">Generar QR</button>
<button onclick="descargarQR('qrcode')">Descargar</button>

<div id="qrcode"></div>
</div>

<!-- CODIGO BARRAS -->
<div id="barcode" style="display:none;">
<h2>Código de Barras</h2>

<input id="barcodeText" placeholder="Número o texto">
<br>
<button onclick="crearBarcode()">Generar</button>
<button onclick="descargarBarcode()">Descargar</button>

<svg id="barcodeSVG"></svg>
</div>

<!-- MI QR -->
<div id="miqr" style="display:none;">
<h2>Mi Código QR</h2>

<input id="nombre" placeholder="Nombre">
<input id="telefono" placeholder="Teléfono">
<input id="correo" placeholder="Correo">
<textarea id="direccion" placeholder="Dirección"></textarea>

<button onclick="crearMiQR()">Crear Mi QR</button>
<button onclick="descargarQR('miqrcode')">Guardar</button>

<div id="miqrcode"></div>
</div>

</div>

<script>

/* MENU */
function toggleMenu(){
menu.classList.toggle("active");
}

function mostrar(id){
document.querySelectorAll(".content > div")
.forEach(d=>d.style.display="none");

document.getElementById(id).style.display="block";
toggleMenu();
}

/* ESCANER ULTRA RAPIDO */
const reader=new ZXing.BrowserMultiFormatReader();

reader.decodeFromVideoDevice(
null,
'video',
(result,err)=>{
if(result){
resultado.innerText="✅ "+result.text;
navigator.vibrate(100);
}
},
{
fps:30,
delayBetweenScanAttempts:50
}
);

/* CREAR QR */
function crearQR(){
qrcode.innerHTML="";
new QRCode("qrcode",{
text:qrtext.value,
width:220,
height:220
});
}

/* MI QR PERSONAL */
function crearMiQR(){

let datos=`BEGIN:VCARD
FN:${nombre.value}
TEL:${telefono.value}
EMAIL:${correo.value}
ADR:${direccion.value}
END:VCARD`;

miqrcode.innerHTML="";

new QRCode("miqrcode",{
text:datos,
width:220,
height:220
});
}

/* CODIGO BARRAS CORREGIDO */
function crearBarcode(){

let texto=document.getElementById("barcodeText").value.trim();

if(texto===""){
alert("Escribe algo para generar el código");
return;
}

document.getElementById("barcodeSVG").innerHTML="";

JsBarcode("#barcodeSVG",texto,{
format:"CODE128",
width:2,
height:100,
displayValue:true,
margin:10
});

}

/* DESCARGAR QR */
function descargarQR(id){

let img=document.querySelector(`#${id} img`);

if(!img){
alert("Primero genera el código");
return;
}

let a=document.createElement("a");
a.href=img.src;
a.download="codigoQR.png";
a.click();
}

/* DESCARGAR BARRAS */
function descargarBarcode(){

let svg=document.getElementById("barcodeSVG");
let data=new XMLSerializer().serializeToString(svg);

let blob=new Blob([data],{type:"image/svg+xml"});
let url=URL.createObjectURL(blob);

let a=document.createElement("a");
a.href=url;
a.download="codigoBarras.svg";
a.click();
}

</script>

</body>
</html>
