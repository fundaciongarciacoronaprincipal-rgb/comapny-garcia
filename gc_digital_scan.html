<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GC Digital Scan</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode/dist/JsBarcode.all.min.js"></script>

<style>

/* ===================== */
/* GENERAL */
/* ===================== */

body{
margin:0;
font-family:Arial;
background:white;
color:#111;
}

/* ===================== */
/* BARRA SUPERIOR */
/* ===================== */

header{
background:#0d6efd;
color:white;
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

nav{
display:flex;
overflow:auto;
background:#0d6efd;
}

nav button{
flex:1;
border:none;
background:#0d6efd;
color:white;
padding:12px;
cursor:pointer;
}

nav button:hover{
background:#084298;
}

/* ===================== */
/* SECCIONES */
/* ===================== */

section{
display:none;
padding:20px;
text-align:center;
}

.activo{
display:block;
}

/* ===================== */
/* ESCANER */
/* ===================== */

.scanner{
width:260px;
height:260px;
border:3px solid #0d6efd;
margin:auto;
position:relative;
overflow:hidden;
border-radius:10px;
}

.linea{
position:absolute;
width:100%;
height:3px;
background:red;
animation:scan 2s infinite linear;
}

@keyframes scan{
0%{top:0}
100%{top:100%}
}

.info{
margin-top:20px;
border:2px dashed #0d6efd;
padding:15px;
border-radius:10px;
min-height:60px;
}

/* ===================== */
/* BOTONES */
/* ===================== */

input{
width:90%;
padding:10px;
margin:8px;
}

button{
padding:10px;
margin:5px;
background:#0d6efd;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.resultado{
margin-top:15px;
display:flex;
justify-content:center;
}

/* HISTORIAL */
.item{
border-bottom:1px solid #ccc;
padding:8px;
}

</style>
</head>

<body>

<header>GC Digital Scan</header>

<nav>
<button onclick="mostrar('scan')">Escanear</button>
<button onclick="mostrar('qr')">QR</button>
<button onclick="mostrar('barras')">Barras</button>
<button onclick="mostrar('micode')">Mi Código</button>
<button onclick="mostrar('historial')">Historial</button>
<button onclick="mostrar('config')">Config</button>
</nav>

<!-- ================= ESCANEAR ================= -->
<section id="scan" class="activo">

<h2>Escáner</h2>

<div class="scanner">
<div class="linea"></div>
</div>

<div class="info" id="infoCodigo">
Aquí aparecerá la información del código
</div>

</section>

<!-- ================= QR ================= -->
<section id="qr">

<h2>Crear Código QR</h2>

<input id="textoQR" placeholder="Texto o dirección">

<button onclick="crearQR()">Crear QR</button>
<button onclick="guardarQR()">Guardar</button>

<div class="resultado">
<div id="qrcode"></div>
</div>

</section>

<!-- ================= BARRAS ================= -->
<section id="barras">

<h2>Crear Código de Barras</h2>

<input id="textoBarras" placeholder="Número o texto">

<button onclick="crearBarras()">Crear</button>
<button onclick="guardarBarras()">Guardar</button>

<div class="resultado">
<svg id="barcode"></svg>
</div>

</section>

<!-- ================= MI CODIGO ================= -->
<section id="micode">

<h2>Crear Mi Código</h2>

<input id="nombre" placeholder="Nombre completo">
<input id="correo" placeholder="Correo electrónico">
<input id="telefono" placeholder="Teléfono">
<input id="direccion" placeholder="Dirección">
<input id="extra" placeholder="Dato opcional">

<button onclick="crearMiCodigo()">Crear Mi QR</button>

<div class="resultado">
<div id="miQR"></div>
</div>

</section>

<!-- ================= HISTORIAL ================= -->
<section id="historial">

<h2>Historial</h2>

<div id="listaHistorial"></div>

</section>

<!-- ================= CONFIG ================= -->
<section id="config">

<h2>Configuración</h2>

<label>
<input type="checkbox" id="vibracion">
 Activar vibración
</label>

<br><br>

<label>
<input type="checkbox" id="sonido">
 Activar sonido
</label>

</section>


<script>

/* CAMBIAR SECCIONES */
function mostrar(id){
document.querySelectorAll("section")
.forEach(s=>s.classList.remove("activo"));

document.getElementById(id)
.classList.add("activo");

if(id==="historial") cargarHistorial();
}

/* ================= QR ================= */

function crearQR(){

document.getElementById("qrcode").innerHTML="";

let texto=document.getElementById("textoQR").value;

new QRCode("qrcode",{
text:texto,
width:200,
height:200
});

guardarHistorial("QR: "+texto);
}

function guardarQR(){
let img=document.querySelector("#qrcode img");
if(!img)return;

let a=document.createElement("a");
a.href=img.src;
a.download="qr.png";
a.click();
}

/* ================= BARRAS ================= */

function crearBarras(){

let txt=document.getElementById("textoBarras").value;

JsBarcode("#barcode",txt,{
format:"CODE128",
displayValue:true
});

guardarHistorial("BARRAS: "+txt);
}

function guardarBarras(){

let svg=document.getElementById("barcode");
let data=new XMLSerializer().serializeToString(svg);

let a=document.createElement("a");
a.href="data:image/svg+xml,"+encodeURIComponent(data);
a.download="barras.svg";
a.click();
}

/* ================= MI CODIGO ================= */

function crearMiCodigo(){

document.getElementById("miQR").innerHTML="";

let datos=
"Nombre:"+nombre.value+
"\nCorreo:"+correo.value+
"\nTel:"+telefono.value+
"\nDir:"+direccion.value+
"\nExtra:"+extra.value;

new QRCode("miQR",{
text:datos,
width:200,
height:200
});

guardarHistorial("MI CODIGO: "+nombre.value);
}

/* ================= HISTORIAL ================= */

function guardarHistorial(texto){

let h=JSON.parse(localStorage.getItem("historial"))||[];
h.push(texto);

localStorage.setItem("historial",JSON.stringify(h));
}

function cargarHistorial(){

let lista=document.getElementById("listaHistorial");
lista.innerHTML="";

let h=JSON.parse(localStorage.getItem("historial"))||[];

h.reverse().forEach(e=>{
lista.innerHTML+=`<div class="item">${e}</div>`;
});
}

</script>

</body>
</html>
