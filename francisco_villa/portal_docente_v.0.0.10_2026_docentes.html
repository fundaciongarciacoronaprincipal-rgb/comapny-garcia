<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portal Docente</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(45deg,#1abc9c,#3498db,#9b59b6);
color:white;
}

header{
background:rgba(0,0,0,0.6);
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{ padding:20px; }

.card{
background:rgba(0,0,0,0.7);
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
}

input, select, button{
padding:10px;
margin:5px;
border-radius:6px;
border:none;
width:90%;
}

button{
cursor:pointer;
background:#2ecc71;
color:white;
font-weight:bold;
}

.hidden{display:none;}

.section{
margin-top:20px;
background:rgba(0,0,0,0.6);
padding:15px;
border-radius:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
background:rgba(0,0,0,0.8);
}

th, td{
border:1px solid rgba(255,255,255,0.3);
padding:8px;
text-align:center;
}

th{
background:rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<header>🎓 Portal Docente</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
<h3>Iniciar Sesión</h3>
<input id="servidor" placeholder="Número servidor">
<input id="password" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">

<div class="section">
<h3 id="infoDocente"></h3>
<p id="grupoInfo"></p>
</div>

<!-- CAPTURA -->
<div class="section">
<h3>Captura de Evaluaciones</h3>

<select id="alumnoSelect"></select>
<select id="materiaSelect"></select>

<input id="eva1" type="number" placeholder="Evaluación 1">
<input id="eva2" type="number" placeholder="Evaluación 2">
<input id="eva3" type="number" placeholder="Evaluación 3">

<button onclick="guardarEvaluacion()">💾 Guardar Evaluación</button>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = supabase.createClient(
"https://nlpdpvjtdxknhvgqbfls.supabase.co",
"sb_publishable_E-rWcFlW68C6ygPUtRhbNQ_Oxcf0ymf"
);

let docenteActual = null;
let alumnosGlobal = [];
let materiasGlobal = [];

/* ================= LOGIN ================= */
async function login(){

let servidor = document.getElementById("servidor").value.trim();
let password = document.getElementById("password").value.trim();

let { data } = await supabaseClient
.from("docentes")
.select("*")
.eq("numero_servidor", servidor)
.eq("password", password);

if(!data || data.length === 0){
alert("Credenciales incorrectas");
return;
}

docenteActual = data[0];

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("panel").classList.remove("hidden");

document.getElementById("infoDocente").innerText =
docenteActual.nombre_completo;

document.getElementById("grupoInfo").innerText =
"Grado: " + docenteActual.grado + " | Grupo: " + docenteActual.grupo;

cargarDatos();
}

/* =============== CARGAR DATOS =============== */
async function cargarDatos(){

let { data: alumnos } = await supabaseClient
.from("alumnos")
.select("id,nombre_completo")
.eq("grado", docenteActual.grado)
.eq("grupo", docenteActual.grupo);

alumnosGlobal = alumnos;

let alumnoSel = document.getElementById("alumnoSelect");
alumnoSel.innerHTML = '<option value="">Seleccionar alumno</option>';

alumnos.forEach(a=>{
alumnoSel.innerHTML += `
<option value="${a.id}">${a.nombre_completo}</option>
`;
});

/* materias del docente */
materiasGlobal = [];

for(let i=1;i<=10;i++){
let m = docenteActual["materia"+i];
if(m && m.trim() !== ""){
materiasGlobal.push(m);
}
}

let materiaSel = document.getElementById("materiaSelect");
materiaSel.innerHTML = '<option value="">Seleccionar materia</option>';

materiasGlobal.forEach(m=>{
materiaSel.innerHTML += `
<option value="${m}">${m}</option>
`;
});

}

/* =============== GUARDAR =============== */
async function guardarEvaluacion(){

let alumno = document.getElementById("alumnoSelect").value;
let materia = document.getElementById("materiaSelect").value;

if(!alumno || !materia){
alert("Selecciona alumno y materia");
return;
}

let eva1 = Number(document.getElementById("eva1").value || 0);
let eva2 = Number(document.getElementById("eva2").value || 0);
let eva3 = Number(document.getElementById("eva3").value || 0);

const { error } = await supabaseClient
.from("evaluaciones")
.upsert({
alumno_id: alumno,
materia: materia,
evaluacion1: eva1,
evaluacion2: eva2,
evaluacion3: eva3,
grado: docenteActual.grado,
grupo: docenteActual.grupo
},{
onConflict:"alumno_id,materia"
});

if(error){
alert(error.message);
return;
}

alert("Evaluación guardada correctamente");
}

</script>

</body>
</html>
