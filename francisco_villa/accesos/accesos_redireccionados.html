<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iniciar sesión | Control de Asistencia</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(0,180,255,.20), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0,110,255,.18), transparent 35%),
        linear-gradient(135deg,#061525,#0b1f35,#07111f);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
}

/* CONTENEDOR */

.login-container{
    width:100%;
    max-width:440px;
    padding:20px;
}

/* TARJETA */

.login-card{
    background:rgba(10,28,48,.94);
    border:1px solid rgba(0,191,255,.25);
    border-radius:24px;
    padding:40px 34px;
    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        0 0 35px rgba(0,174,255,.08);
    backdrop-filter:blur(14px);
}

/* ICONO */

.logo{
    width:82px;
    height:82px;
    margin:0 auto 20px;
    border-radius:22px;
    background:linear-gradient(135deg,#009dff,#005bea);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    box-shadow:
        0 12px 30px rgba(0,130,255,.30);
}

/* TITULOS */

h1{
    text-align:center;
    font-size:27px;
    margin-bottom:8px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    color:#9fb5c9;
    font-size:14px;
    line-height:1.5;
    margin-bottom:30px;
}

/* CAMPOS */

.field{
    margin-bottom:19px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#c7d8e8;
    margin-bottom:8px;
}

.input-wrapper{
    position:relative;
}

input{
    width:100%;
    height:52px;
    border-radius:13px;
    border:1px solid rgba(157,190,215,.20);
    background:#081827;
    color:#fff;
    padding:0 15px;
    font-size:15px;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:#00aaff;
    box-shadow:0 0 0 3px rgba(0,170,255,.10);
}

input::placeholder{
    color:#63798d;
}

/* PASSWORD */

.password-input{
    padding-right:55px;
}

.show-password{
    position:absolute;
    right:8px;
    top:7px;
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:transparent;
    color:#8ca6ba;
    cursor:pointer;
    font-size:18px;
}

.show-password:hover{
    background:rgba(255,255,255,.06);
    color:#fff;
}

/* BOTON */

.login-button{
    width:100%;
    height:53px;
    border:0;
    border-radius:13px;
    margin-top:7px;
    background:linear-gradient(135deg,#00a8ff,#0068e8);
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 10px 25px rgba(0,125,255,.22);
}

.login-button:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 30px rgba(0,125,255,.32);
}

.login-button:active{
    transform:translateY(0);
}

.login-button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

/* MENSAJE */

.message{
    display:none;
    margin-top:18px;
    padding:13px 15px;
    border-radius:11px;
    font-size:13px;
    line-height:1.4;
    text-align:center;
}

.message.error{
    display:block;
    background:rgba(220,50,50,.10);
    border:1px solid rgba(255,80,80,.20);
    color:#ff9b9b;
}

.message.success{
    display:block;
    background:rgba(0,190,120,.10);
    border:1px solid rgba(0,220,140,.20);
    color:#77e8ba;
}

/* PIE */

.footer{
    text-align:center;
    margin-top:24px;
    color:#637b90;
    font-size:11px;
}

/* CARGANDO */

.loading{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
}

.spinner{
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* RESPONSIVE */

@media(max-width:500px){

    .login-container{
        padding:15px;
    }

    .login-card{
        padding:32px 22px;
        border-radius:20px;
    }

    h1{
        font-size:24px;
    }

}

</style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🔐
        </div>

        <h1>Iniciar sesión</h1>

        <div class="subtitle">
            Control de Asistencia<br>
            OFTV No. 0216
        </div>

        <!-- NOMBRE -->

        <div class="field">

            <label for="nombre">
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Ingresa tu nombre"
                autocomplete="username"
                maxlength="150"
            >

        </div>

        <!-- CONTRASEÑA -->

        <div class="field">

            <label for="password">
                Contraseña
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="password"
                    class="password-input"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    maxlength="100"
                >

                <button
                    type="button"
                    class="show-password"
                    id="showPassword"
                    title="Mostrar contraseña"
                    aria-label="Mostrar contraseña"
                >
                    👁
                </button>

            </div>

        </div>

        <!-- BOTON -->

        <button
            type="button"
            class="login-button"
            id="loginButton"
        >
            Iniciar sesión
        </button>

        <!-- MENSAJE -->

        <div
            id="message"
            class="message"
        ></div>

        <div class="footer">
            Sistema de acceso · Grupo García Corona
        </div>

    </div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://nlpdpvjtdxknhvgqbfls.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_E-rWcFlW68C6ygPUtRhbNQ_Oxcf0ymf";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTOS
========================================================= */

const nombreInput =
    document.getElementById("nombre");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const showPassword =
    document.getElementById("showPassword");

const message =
    document.getElementById("message");


/* =========================================================
   MOSTRAR / OCULTAR CONTRASEÑA
========================================================= */

showPassword.addEventListener("click", function(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";

        showPassword.textContent = "🙈";

        showPassword.title =
            "Ocultar contraseña";

        showPassword.setAttribute(
            "aria-label",
            "Ocultar contraseña"
        );

    }else{

        passwordInput.type = "password";

        showPassword.textContent = "👁";

        showPassword.title =
            "Mostrar contraseña";

        showPassword.setAttribute(
            "aria-label",
            "Mostrar contraseña"
        );

    }

});


/* =========================================================
   SHA-256
========================================================= */

async function sha256(texto){

    const encoder =
        new TextEncoder();

    const data =
        encoder.encode(texto);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const hashArray =
        Array.from(
            new Uint8Array(hashBuffer)
        );

    return hashArray
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2,"0")
        )
        .join("");

}


/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(texto,tipo){

    message.textContent =
        texto;

    message.className =
        "message " + tipo;

}


/* =========================================================
   BLOQUEAR PANTALLA
========================================================= */

function bloquearPantalla(){

    document.body.innerHTML = "";

    document.body.style.background =
        "#ffffff";

    document.documentElement.style.background =
        "#ffffff";

}


/* =========================================================
   VALIDAR URL
========================================================= */

function urlEsValida(url){

    try{

        const objeto =
            new URL(url);

        return (
            objeto.protocol === "http:" ||
            objeto.protocol === "https:"
        );

    }catch(error){

        return false;

    }

}


/* =========================================================
   INICIAR SESIÓN
========================================================= */

async function iniciarSesion(){

    const nombre =
        nombreInput.value.trim();

    const password =
        passwordInput.value;

    /* VALIDACIONES */

    if(!nombre){

        mostrarMensaje(
            "Ingresa tu nombre.",
            "error"
        );

        nombreInput.focus();

        return;

    }

    if(!password){

        mostrarMensaje(
            "Ingresa tu contraseña.",
            "error"
        );

        passwordInput.focus();

        return;

    }


    /* ESTADO CARGANDO */

    loginButton.disabled = true;

    loginButton.innerHTML = `
        <span class="loading">
            <span class="spinner"></span>
            Verificando...
        </span>
    `;

    message.className =
        "message";


    try{

        /* HASH */

        const passwordHash =
            await sha256(password);


        /* CONSULTA SUPABASE */

        const { data, error } =
            await supabaseClient.rpc(
                "validar_acceso_asistencia",
                {
                    p_nombre:
                        nombre,

                    p_password_hash:
                        passwordHash
                }
            );


        /* ERROR DE SUPABASE */

        if(error){

            console.error(
                "Error Supabase:",
                error
            );

            mostrarMensaje(
                "No fue posible verificar el acceso.",
                "error"
            );

            restaurarBoton();

            return;

        }


        /* RESPUESTA */

        let resultado = data;

        /*
           En algunos casos Supabase puede devolver
           el JSON como texto.
        */

        if(typeof resultado === "string"){

            try{

                resultado =
                    JSON.parse(resultado);

            }catch(e){

                resultado = null;

            }

        }


        /* ACCESO DENEGADO */

        if(
            !resultado ||
            resultado.ok !== true
        ){

            /*
               Puedes cambiar esta parte por
               mostrarMensaje(...) si quieres
               mantener visible el formulario.

               Actualmente, después de un intento
               incorrecto, se bloquea la pantalla.
            */

            bloquearPantalla();

            return;

        }


        /* URL DEL USUARIO */

        const urlAcceso =
            resultado.url_acceso;


        if(
            !urlAcceso ||
            !urlEsValida(urlAcceso)
        ){

            mostrarMensaje(
                "El acceso no tiene un link válido configurado.",
                "error"
            );

            restaurarBoton();

            return;

        }


        /* ÉXITO */

        mostrarMensaje(
            "Acceso autorizado. Redirigiendo...",
            "success"
        );


        /*
           REDIRECCIÓN AL LINK QUE
           ESTÁ GUARDADO EN SUPABASE.
        */

        setTimeout(function(){

            window.location.replace(
                urlAcceso
            );

        },500);


    }catch(error){

        console.error(
            "Error:",
            error
        );

        mostrarMensaje(
            "Ocurrió un error al iniciar sesión.",
            "error"
        );

        restaurarBoton();

    }

}


/* =========================================================
   RESTAURAR BOTÓN
========================================================= */

function restaurarBoton(){

    loginButton.disabled =
        false;

    loginButton.textContent =
        "Iniciar sesión";

}


/* =========================================================
   BOTÓN
========================================================= */

loginButton.addEventListener(
    "click",
    iniciarSesion
);


/* =========================================================
   ENTER
========================================================= */

nombreInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            passwordInput.focus();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            iniciarSesion();

        }

    }
);

</script>

</body>
</html>
