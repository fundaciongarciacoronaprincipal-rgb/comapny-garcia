
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12345a">
<meta name="description" content="Aplicación web instalable">

<title>Aplicación Web</title>

<link rel="manifest" href="./manifest.webmanifest">

<link rel="icon" href="https://companygarciacorona.com.mx/francisco_villa/imagenes/logo_telesecundaria.png">

<link rel="apple-touch-icon" href="https://companygarciacorona.com.mx/francisco_villa/imagenes/logo_telesecundaria.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: white;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}
</style>
</head>

<body>

<iframe
    id="pagina"
    title="Contenido de la aplicación"
    allow="fullscreen">
</iframe>

<script>

// ENLACE DE LA PÁGINA QUE SE MOSTRARÁ

const URL_PAGINA = "https://companygarciacorona.com.mx/mis/pruevas/sistema_1/mensaje.html";

document.getElementById("pagina").src = URL_PAGINA;

// REGISTRO PWA

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
    });
}

</script>

</body>
</html>
