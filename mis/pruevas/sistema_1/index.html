<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Conexión</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 500px; margin: 0 auto; }
        .ok { background: #dcfce7; border-left: 4px solid #16a34a; padding: 1rem; border-radius: 6px; }
        .err { background: #fee2e2; border-left: 4px solid #dc2626; padding: 1rem; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Estado de conexión</h1>
    <div id="estado">Conectando...</div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const supabase = createClient(
            "https://fgalttrkjhmurmkfzzepb.supabase.co",
            "sb_publishable_5TT2kDET33HdZN9aIWz7ow_pEe94gZQ"
        );

        async function probar() {
            const el = document.getElementById('estado');
            try {
                const { data, error } = await supabase
                    .from('proyectos')
                    .select('identificador, nombre, activo')
                    .eq('identificador', 'prueva')
                    .limit(1);

                if (error) throw error;

                if (data.length > 0) {
                    el.className = 'ok';
                    el.innerHTML = `✅ <strong>¡CONEXIÓN EXITOSA!</strong><br>
                                    ID: ${data[0].identificador}<br>
                                    Nombre: ${data[0].nombre}<br>
                                    Activo: ${data[0].activo ? 'SÍ' : 'NO'}`;
                } else {
                    el.innerHTML = '⚠️ No se encontró el proyecto';
                }
            } catch (err) {
                el.className = 'err';
                el.innerHTML = `❌ Error: ${err.message}<br>
                <small>Si dice "Failed to fetch": Ábrelo desde tu navegador<br>
                NO desde la vista previa de tu programa</small>`;
            }
        }
        probar();
    </script>
</body>
</html>
