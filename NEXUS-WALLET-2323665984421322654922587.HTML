<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#87CEEB;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    margin:auto;
    background:white;
    color:black;
    padding:25px;
    border-radius:22px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

h1,h2,h3{
    text-align:center;
    color:#203a43;
}

input{
    width:100%;
    padding:13px;
    margin-top:12px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#1d4ed8;
}

.seccion{
    display:none;
}

.active{
    display:block;
}

.card{
    margin-top:20px;
    background:#f5f5f5;
    padding:15px;
    border-radius:12px;
}

#saludoUsuario{
    color:black;
    text-align:center;
    margin-bottom:20px;
    font-size:24px;
}

.saldoCard{
    position:relative;
    width:320px;
    height:220px;
    margin:auto;
    background:
    linear-gradient(
        135deg,
        #1e3a8a,
        #2563eb,
        #60a5fa
    );
    border-radius:22px;
    padding:18px;
    color:white;
    overflow:hidden;
    box-shadow:
    0 15px 35px rgba(0,0,0,0.35);
    margin-bottom:20px;
}

.walletTitle{
    position:absolute;
    top:18px;
    right:20px;
    font-size:15px;
    font-weight:bold;
}

.chip{
    width:60px;
    height:40px;
    border-radius:10px;
    background:
    linear-gradient(
        135deg,
        #fcd34d,
        #f59e0b
    );
    position:absolute;
    top:38px;
    left:20px;
}

.saldoNumero{
    position:absolute;
    top:95px;
    left:20px;
    font-size:32px;
    font-weight:bold;
}

.saldoLabel{
    position:absolute;
    top:138px;
    left:22px;
    opacity:0.8;
    font-size:13px;
}

.usuarioCardNombre{
    position:absolute;
    top:158px;
    left:22px;
    font-size:14px;
    font-weight:bold;
}

.cardBottom{
    position:absolute;
    bottom:12px;
    right:18px;
    display:flex;
    gap:25px;
}

.small{
    font-size:11px;
    opacity:0.7;
    margin:0;
}

#clabeInfoCard,
#referenciaInfoCard{
    margin:0;
    margin-top:4px;
    font-weight:bold;
    font-size:13px;
}

</style>
</head>

<body>

<div class="container">

<!-- INICIO -->

<div id="inicio" class="seccion active">

<h1>Nexus Wallet</h1>

<button onclick="mostrar('login')">
Iniciar sesión
</button>

<button onclick="mostrar('registro')">
Crear cuenta
</button>

</div>

<!-- REGISTRO -->

<div id="registro" class="seccion">

<h2>Crear cuenta</h2>

<input
type="text"
id="nuevoUsuario"
placeholder="Nombre de usuario"
>

<input
type="password"
id="nuevoPassword"
placeholder="Contraseña"
>

<button onclick="crearCuenta()">
Crear cuenta
</button>

<button onclick="mostrar('inicio')">
Volver
</button>

</div>

<!-- LOGIN -->

<div id="login" class="seccion">

<h2>Iniciar sesión</h2>

<input
type="text"
id="loginUsuario"
placeholder="Usuario"
>

<input
type="password"
id="loginPassword"
placeholder="Contraseña"
>

<button onclick="iniciarSesion()">
Entrar
</button>

<button onclick="mostrar('inicio')">
Volver
</button>

</div>

<!-- WALLET -->

<div id="wallet" class="seccion">

<h2 id="saludoUsuario">
¡HOLA! BIENVENID@
</h2>

<div class="saldoCard">

<div class="walletTitle">
NEXUS WALLET
</div>

<div class="chip"></div>

<div
id="saldoTexto"
class="saldoNumero"
>
$0
</div>

<div class="saldoLabel">
Saldo disponible
</div>

<div
id="usuarioCardNombre"
class="usuarioCardNombre"
>
usuario
</div>

<div class="cardBottom">

<div>
<p class="small">
CLABE
</p>

<p id="clabeInfoCard">
0000000000
</p>
</div>

<div>
<p class="small">
Referencia
</p>

<p id="referenciaInfoCard">
0000000
</p>
</div>

</div>

</div>

<button onclick="mostrarPagoServicio()">
Pagar servicio Company García Corona
</button>

<button onclick="mostrarTransferencia()">
Transferencia interna
</button>

<button onclick="mostrarCanje()">
Canjear código
</button>

<button onclick="cerrarSesion()">
Cerrar sesión
</button>

</div>

<!-- PAGAR SERVICIO -->

<div id="pagoServicio" class="seccion">

<h2>Pagar servicio</h2>

<input
type="text"
id="numeroServicioPago"
placeholder="Número de servicio o referencia"
>

<button onclick="consultarServicio()">
Consultar saldo
</button>

<div
id="infoServicio"
class="card"
style="display:none;"
>

<h3 id="saldoServicioTexto">
Saldo pendiente: $0
</h3>

<input
type="number"
id="montoPago"
placeholder="Monto a pagar"
>

<button onclick="pagarServicio()">
Realizar pago
</button>

</div>

<button onclick="volverWallet()">
Volver
</button>

</div>

<!-- TRANSFERENCIA -->

<div id="transferencia" class="seccion">

<h2>Transferencia interna</h2>

<input
type="text"
id="destinoTransferencia"
placeholder="Usuario, CLABE o referencia"
>

<input
type="number"
id="montoTransferencia"
placeholder="Monto"
>

<button onclick="hacerTransferencia()">
Transferir
</button>

<button onclick="volverWallet()">
Volver
</button>

</div>

<!-- CANJEAR -->

<div id="canje" class="seccion">

<h2>Canjear código</h2>

<input
type="text"
id="codigoCanje"
placeholder="Código"
>

<button onclick="canjearCodigo()">
Canjear
</button>

<button onclick="volverWallet()">
Volver
</button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://ieaielptonscbsimbtyx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pmJ3fN_2FUKM1AskoReusA_0vaZz7f_";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let usuarioActual = null;
let servicioActual = null;

/* RESTAURAR SESION */

const sesionGuardada =
localStorage.getItem(
    "nexus_wallet_user"
);

if(sesionGuardada){

    usuarioActual =
    JSON.parse(sesionGuardada);

    mostrar("wallet");

    actualizarWallet();

    iniciarAutoRefresh();

}

function mostrar(id){

    document
    .querySelectorAll(".seccion")
    .forEach(sec=>{

        sec.classList.remove("active");

    });

    document
    .getElementById(id)
    .classList.add("active");

}

function generarNumeros(longitud){

    let resultado = "";

    for(let i=0;i<longitud;i++){

        resultado +=
        Math.floor(Math.random() * 10);

    }

    return resultado;

}

async function crearCuenta(){

    const usuario =
    document.getElementById(
        "nuevoUsuario"
    ).value;

    const password =
    document.getElementById(
        "nuevoPassword"
    ).value;

    const identificador =
    generarNumeros(10);

    const referencia =
    generarNumeros(7);

    const { error } =
    await supabaseClient
    .from("nexus_wallet_users")
    .insert([
        {
            usuario,
            password,
            identificador,
            referencia,
            saldo:0
        }
    ]);

    if(error){

        alert(error.message);
        return;

    }

    alert("Cuenta creada");

    mostrar("login");

}

async function iniciarSesion(){

    const usuario =
    document.getElementById(
        "loginUsuario"
    ).value;

    const password =
    document.getElementById(
        "loginPassword"
    ).value;

    const { data, error } =
    await supabaseClient
    .from("nexus_wallet_users")
    .select("*")
    .eq("usuario",usuario)
    .eq("password",password);

    if(error || data.length === 0){

        alert("Datos incorrectos");
        return;

    }

    usuarioActual = data[0];

    localStorage.setItem(
        "nexus_wallet_user",
        JSON.stringify(usuarioActual)
    );

    actualizarWallet();

    mostrar("wallet");

    iniciarAutoRefresh();

}

async function refrescarDatos(){

    if(!usuarioActual) return;

    const { data } =
    await supabaseClient
    .from("nexus_wallet_users")
    .select("*")
    .eq("id",usuarioActual.id);

    if(data && data.length > 0){

        usuarioActual = data[0];

        localStorage.setItem(
            "nexus_wallet_user",
            JSON.stringify(usuarioActual)
        );

        actualizarWallet();

    }

}

function iniciarAutoRefresh(){

    setInterval(()=>{

        refrescarDatos();

    },1000);

}

function actualizarWallet(){

    document.getElementById(
        "saldoTexto"
    ).innerHTML =
    "$" + usuarioActual.saldo;

    document.getElementById(
        "usuarioCardNombre"
    ).innerHTML =
    usuarioActual.usuario;

    document.getElementById(
        "clabeInfoCard"
    ).innerHTML =
    usuarioActual.identificador;

    document.getElementById(
        "referenciaInfoCard"
    ).innerHTML =
    usuarioActual.referencia;

    document.getElementById(
        "saludoUsuario"
    ).innerHTML =
    "¡HOLA! BIENVENID@ " +
    usuarioActual.usuario;

}

function mostrarPagoServicio(){

    mostrar("pagoServicio");

}

function mostrarTransferencia(){

    mostrar("transferencia");

}

function mostrarCanje(){

    mostrar("canje");

}

function volverWallet(){

    actualizarWallet();

    mostrar("wallet");

}

function cerrarSesion(){

    usuarioActual = null;

    localStorage.removeItem(
        "nexus_wallet_user"
    );

    mostrar("inicio");

}

</script>

</body>
</html>
